name: ci

on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20.19.0', '22.12.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install ripgrep for retrieval integration tests
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            choco install ripgrep --no-progress -y
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  docs:
    name: docs and component drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: verify committed documentation without modifying the checkout
        run: npm run docs:check
      - name: verify the committed failure ledger
        if: always()
        run: node scripts/events/failure-report.mjs --check
  security:
    name: secrets and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run ci:secrets
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
  licenses:
    name: license inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run license:inventory
      - name: inventory must be committed
        run: git diff --exit-code THIRD_PARTY_LICENSES.generated.md
  architecture-baseline:
    name: architecture performance baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - name: measure architecture hot paths, reservations, and indexing
        run: npm run bench:architecture
  not-run:
    name: acceptance gates NOT run by CI
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "### Not covered by CI (green here is not acceptance)"
            echo "- Real Docker/Crabbox sandbox (S0/S1, on permanent hold under D-110)"
            echo "- Live OpenRouter / Ollama full coding tasks (S4)"
            echo "- Human-labelled evaluation (S6) and live poisoning/embedding runs (S7)"
            echo "- Desktop shell measurements (1B.4)"
          } >> "$GITHUB_STEP_SUMMARY"
  ci-pass:
    name: ci-pass
    if: always()
    needs: [verify, docs, security, licenses, architecture-baseline]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
