name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: typecheck + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Tests that need a local Ollama or a real sandbox skip themselves when it is absent.
      - run: npm test
